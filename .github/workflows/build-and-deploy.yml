name: Create Release, Build and Deploy Image

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request_target:
    branches:
      - "main"
      - "beta"
    types: [closed]

permissions:
  actions: write
  contents: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  build-and-release-image:
    if: github.actor == 'dependabot[bot]' || github.event_name == 'push'
    uses: tkhom3/gha-workflows/.github/workflows/build-and-push-image.yml@5d9e6141ae507be5e77c26d5530e99a0903cdf7b # v1.0.27
    secrets: inherit
