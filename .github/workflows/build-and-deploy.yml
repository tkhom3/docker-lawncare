name: Create Release, Build and Deploy Image

on:
  push:
    branches:
      - "main"
      - "beta"
  pull_request_target:
    branches:
      - "main"
      - "beta"
    types: [closed]

permissions:
  actions: write
  contents: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  build-and-release-image:
    if: github.actor == 'dependabot[bot]' || github.event_name == 'push'
    uses: tkhom3/gha-workflows/.github/workflows/build-and-push-image.yml@c553bef97cc0954b86a00f9db202be1b247fdf1e # v1.0.30
    secrets: inherit
